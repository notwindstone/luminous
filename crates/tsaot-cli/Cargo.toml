[package]
name = "tsaot-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
tsaot-codegen = { version = "0.1.0", path = "../tsaot-codegen" }
tsaot-front = { version = "0.1.0", path = "../tsaot-front" }

[[bin]]
name = "tsaot"
path = "src/main.rs"
